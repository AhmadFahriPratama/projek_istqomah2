<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Curved text paths -->
    <path id="textArcTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
    <path id="textArcBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none" />
    
    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8B4E26" />
      <stop offset="60%" stop-color="#5A2E14" />
      <stop offset="100%" stop-color="#3D1C0B" />
    </radialGradient>

    <!-- Outer Ring Drop Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Group with Shadow -->
  <g filter="url(#logoShadow)">
    <!-- Layer 1: Outer Dark Ring Border -->
    <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#2E1B0A" stroke-width="2.5" />

    <!-- Layer 2: White Ring for Circular Text -->
    <circle cx="100" cy="100" r="95" fill="#FFFFFF" />

    <!-- Layer 3: Top Curved Text (ISTIQOMAH GROSIR) -->
    <text fill="#5A2E14" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="14.5" letter-spacing="2.8">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        ISTIQOMAH GROSIR
      </textPath>
    </text>

    <!-- Layer 4: Bottom Curved Text (KETANGGUNGAN) -->
    <text fill="#5A2E14" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="13" letter-spacing="3.2">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        KETANGGUNGAN
      </textPath>
    </text>

    <!-- Layer 5: Two 5-Pointed Stars (9 o'clock & 3 o'clock) -->
    <!-- Left Star -->
    <polygon points="28,100 32.5,96.5 31,102 35.5,98.5 30,98.5" fill="#5A2E14" transform="translate(1, 0) scale(1.1)"/>
    <g transform="translate(26, 100)">
      <polygon points="0,-6.5 2,-2 6.5,-2 3,1 4.5,5.5 0,3 -4.5,5.5 -3,1 -6.5,-2 -2,-2" fill="#5A2E14"/>
    </g>
    <!-- Right Star -->
    <g transform="translate(174, 100)">
      <polygon points="0,-6.5 2,-2 6.5,-2 3,1 4.5,5.5 0,3 -4.5,5.5 -3,1 -6.5,-2 -2,-2" fill="#5A2E14"/>
    </g>

    <!-- Layer 6: Inner Dark Border & Solid Brown Core -->
    <circle cx="100" cy="100" r="62" fill="url(#centerGlow)" stroke="#2E1B0A" stroke-width="2" />
    <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <!-- Layer 7: White "IGK" Monogram in Center -->
    <g transform="translate(100, 107)">
      <text x="0" y="0" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="44" letter-spacing="-3" text-anchor="middle">
        IGK
      </text>
    </g>

    <!-- Layer 8: 4 White Sparkles in Upper Right -->
    <!-- Sparkle 1 (Main) -->
    <path d="M 128 72 Q 128 78 134 78 Q 128 78 128 84 Q 128 78 122 78 Q 128 78 128 72 Z" fill="#FFFFFF" />
    <!-- Sparkle 2 (Top small) -->
    <path d="M 136 65 Q 136 68 139 68 Q 136 68 136 71 Q 136 68 133 68 Q 136 68 136 65 Z" fill="#FFFFFF" />
    <!-- Sparkle 3 (Left tiny) -->
    <path d="M 120 63 Q 120 65 122 65 Q 120 65 120 67 Q 120 65 118 65 Q 120 65 120 63 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Sparkle 4 (Bottom tiny) -->
    <path d="M 140 86 Q 140 88 142 88 Q 140 88 140 90 Q 140 88 138 88 Q 140 88 140 86 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
